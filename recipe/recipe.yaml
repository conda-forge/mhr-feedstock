schema_version: 1

context:
  name: mhr
  version: "1.2.1"
  python_min: "3.12"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/mhr/mhr-${{ version }}.tar.gz
  sha256: 4eea76d87c4d7b1fcfabe977870c643d7e0703e803d7e0d175ef678bfa11d030

build:
  noarch: python
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - mhr-download-assets = mhr.download_assets:main

requirements:
  host:
    - hatch-vcs
    - hatchling
    - pip
    - python ${{ python_min }}.*
  run:
    - numpy
    # pymomentum-core: mhr.mhr needs only pymomentum.geometry and pymomentum.torch,
    # and core works with any PyTorch build. 0.1.111 is its first conda-forge build;
    # mhr checks for 0.1.89 or newer at import.
    - pymomentum-core >=0.1.111,<0.2
    - python >=${{ python_min }}
    - pytorch

tests:
  - python:
      imports:
        - mhr
        - mhr.mhr
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - python run_test.py
      - mhr-download-assets --help
      # mhr.MHR (from v1.2.0) runs with PyTorch alone: load it with PyMomentum blocked.
      - python -c "import sys; sys.modules['pymomentum'] = None; from mhr import MHR; assert MHR.__module__ == 'mhr._model'"
    files:
      recipe:
        - run_test.py
    requirements:
      run:
        - python ${{ python_min }}.*

about:
  homepage: https://github.com/facebookresearch/MHR
  repository: https://github.com/facebookresearch/MHR
  documentation: https://github.com/facebookresearch/MHR
  summary: Momentum Human Rig is an anatomically-inspired parametric full-body digital human model developed at Meta.
  description: |
    Momentum Human Rig is an anatomically-inspired parametric full-body digital human model developed at Meta.
    It includes: A parametric body skeletal model; A realistic 3D mesh skinned to the skeleton with levels of detail;
    A body blendshape and pose corrective model; A facial blendshape model. Its design is friendly for both CG and CV communities.
  license: Apache-2.0
  license_file: LICENSE

extra:
  feedstock-name: mhr
  recipe-maintainers:
    - jeongseok-meta
